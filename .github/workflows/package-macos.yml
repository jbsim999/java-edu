name: Package and verify macOS

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'codex/macos-packaging']
    paths-ignore: ['README.md', 'docs/**', 'AGENTS.md', 'CONTRIBUTING.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-regression:
    name: Windows execution regression
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run check
      - run: npm run test:local
      - shell: pwsh
        run: |
          $env:JAVA_EDU_JDK_21 = $env:JAVA_HOME
          node tests/local/java-smoke.mjs

  macos:
    name: macOS ${{ matrix.arch }} DMG and ZIP
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    env:
      NODE_TLS_REJECT_UNAUTHORIZED: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - name: Verify native runner
        run: node -e "if(process.platform!=='darwin'||process.arch!=='${{ matrix.arch }}')throw Error('Wrong native runner')"
      - run: npm ci
      - run: npm run check
      - run: npm run test:local
      - name: Verify and stage complete vendor distributions
        run: npm run prepare:mac
      - run: npm run check:bundle
      - name: Execute included Java and Spring before packaging
        run: |
          task_node="$(command -v node)"
          env -u JAVA_HOME -u MAVEN_HOME -u M2_HOME PATH=/usr/bin:/bin JAVA_EDU_BUNDLE_SMOKE_PROJECT=tx-proxy "$task_node" tests/local/bundled-runtime-smoke.mjs
      - name: Build native DMG and ZIP
        run: npm run build:desktop:mac -- --${{ matrix.arch }}
      - name: Verify final packages and production app execution
        run: node scripts/verify-macos-packages.mjs --arch ${{ matrix.arch }}
      - name: Preserve packages and verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: java-edu-macos-${{ matrix.arch }}-${{ github.sha }}
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
          path: |
            desktop-release/Java-Edu-*-mac-${{ matrix.arch }}.dmg
            desktop-release/Java-Edu-*-mac-${{ matrix.arch }}.zip
            work/macos-qa/**/*.json
            work/macos-qa/**/*.png
            work/macos-vendor-${{ matrix.arch }}/download-verification.json
            work/bundled-runtime-smoke-*/results.json
